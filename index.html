<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhaichara Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        /* Container Setup */
        .card { background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; border: 1px solid #2d2d2d; }
        h1 { color: #ff4d4d; font-size: 28px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* Form Inputs */
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: #ff4d4d; }
        
        /* Buttons */
        .btn { width: 100%; padding: 14px; background: #ff4d4d; border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; text-decoration: none; display: inline-block; }
        .btn:hover { background: #e03a3a; box-shadow: 0 4px 12px rgba(255, 77, 77, 0.4); }
        
        /* Status Text */
        .status-container { margin: 20px 0; padding: 12px; background: #252525; border-radius: 8px; font-size: 16px; border: 1px dashed #444; }
        .status-dot { inline-size: 10px; block-size: 10px; background-color: #888; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online { background-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .offline { background-color: #e74c3c; box-shadow: 0 0 8px #e74c3c; }
        
        .ip-box { font-family: monospace; color: #2ecc71; background: #1a1a1a; padding: 8px; border-radius: 5px; margin: 10px 0; display: block; border: 1px solid #333; }
        .footer { margin-top: 25px; font-size: 12px; color: #666; }
        
        /* Error message */
        #error-msg { color: #ff4d4d; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div class="card" id="login-card">
        <h1>CreeperHost Login</h1>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter Admin Username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter Admin Password">
        </div>
        <button class="btn" onclick="handleLogin()">Sign In</button>
        <p id="error-msg"></p>
    </div>

    <!-- 2. MAIN PANEL SCREEN (Hidden by default) -->
    <div class="card" id="panel-card" style="display: none;">
        <h1>Bhaichara Panel</h1>
        
        <div class="status-container">
            Status: <span class="status-dot" id="dot"></span><span id="status-text">Loading...</span>
        </div>

        <span class="ip-box">Brothershood-hCFt.aternos.me</span>

        <p style="margin-bottom: 15px; color: #aaa; font-size: 14px;">Queue bypass karne ke liye niche click karein:</p>
        <a href="https://aternos.org/server/" target="_blank" class="btn">Start Server</a>

        <div class="footer">
            Developed by Farhad | Powered by Bhaichara
        </div>
    </div>

    <script>
        // Login functionality
        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await response.json();

            if (data.success) {
                document.getElementById('login-card').style.display = 'none';
                document.getElementById('panel-card').style.display = 'block';
                fetchServerStatus(); // Load status once logged in
            } else {
                errorMsg.innerText = data.message;
                errorMsg.style.display = 'block';
            }
        }

        // Live status fetch function
        async function fetchServerStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                const statusText = document.getElementById('status-text');
                const dot = document.getElementById('dot');

                if (data.online) {
                    statusText.innerText = `Online Ready (${data.players} Players)`;
                    statusText.style.color = '#2ecc71';
                    dot.className = "status-dot online";
                } else {
                    statusText.innerText = "Offline (Band Hai)";
                    statusText.style.color = '#e74c3c';
                    dot.className = "status-dot offline";
                }
            } catch (err) {
                document.getElementById('status-text').innerText = "Error Loading Status";
            }
        }
    </script>
</body>
</html>
